events {
    worker_connections 1024;
}

http {
    # Upstream block pointing to the calculator Spring Boot service
    upstream calculator_backend {
        server calculator:8080;
    }

    server {
        listen 80;

        # Proxy all /api/ requests to the Spring Boot app
        location /api/ {
            proxy_pass         http://calculator_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Also proxy actuator health so Compose health checks work via port 80
        location /actuator/ {
            proxy_pass         http://calculator_backend;
            proxy_set_header   Host              $host;
        }

        # Root path — simple status page
        location / {
            return 200 'Calculator API is running. Use /api/v1/{add,subtract,multiply,divide}';
            add_header Content-Type text/plain;
        }
    }
}

